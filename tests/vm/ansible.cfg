# like production (log_path + log_plays), so the secrets check covers every place a run is logged
[defaults]
inventory = /work/inventory
roles_path = /roles
stdout_callback = ansible.builtin.default
callback_result_format = yaml
callbacks_enabled = community.general.log_plays
log_path = /work/logs/ansible.log
retry_files_enabled = False
host_key_checking = False
interpreter_python = auto_silent

[callback_log_plays]
log_folder = /work/logs/hosts

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o LogLevel=ERROR
