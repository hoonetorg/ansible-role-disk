---
disk:
  luks:
    devices:
      - { device: /dev/disk/by-id/virtio-tdisk3, name: t_whole, cryptpw: "{{ test_passphrase }}" }
  btrfs:
    filesystems:
      - device: /dev/mapper/t_whole
        label: t-whole
        subvolumes:
          - { name: /data }
        mounts:
          - { path: /t/whole, subvol: /data }
