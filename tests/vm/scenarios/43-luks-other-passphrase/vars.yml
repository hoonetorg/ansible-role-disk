---
disk:
  parted:
    disks:
      - device: /dev/disk/by-id/virtio-tdisk1
        partitions:
          - { number: 1, name: t-p1, start: 1MiB, end: "100%" }
  luks:
    devices:
      - { device: /dev/disk/by-id/virtio-tdisk1-part1, name: t_x, cryptpw: "{{ test_passphrase }}" }
  btrfs:
    filesystems:
      - { device: /dev/mapper/t_x, label: t-x }
